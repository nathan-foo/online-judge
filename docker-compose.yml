services:
  client:
    build:
      context: ./client
      args:
        - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env.local
  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      TEST_SERVICE_URL: "http://test-service:8000"
      ALLOWED_ORIGINS: "http://localhost:3000"
    secrets:
      - clerk_secret_key
    depends_on:
      - test-service
    stop_grace_period: 30s
  test-service:
    build: ./services/test-service
    ports:
      - "8001:8000"
secrets:
  clerk_secret_key:
    file: ./secrets/clerk_secret_key.txt