services:
  client:
    build:
      context: ./client
      args:
        - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env.local
  test-service:
    build: ./services/test-service
    ports:
      - "8001:8000"