services:
  client:
    build: ./client
    ports:
      - "3000:3000"
  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      TEST_SERVICE_URL: "http://test-service:8000"
    depends_on:
      - test-service
  test-service:
    build: ./services/test-service
    ports:
      - "8001:8000"