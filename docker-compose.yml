services:
  client:
    build:
      context: ./client
      args:
        - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env.local
  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      USER_SERVICE_URL: "http://user-service:8000"
      QUIZ_SERVICE_URL: "http://quiz-service:8000"
      ATTEMPT_SERVICE_URL: "http://attempt-service:8000"
      ALLOWED_ORIGINS: "http://localhost:3000"
      REDIS_URL: "redis://redis:6379/0"
      RATE_LIMIT_GLOBAL: "100"
    secrets:
      - clerk_secret_key
    depends_on:
      user-service:
        condition: service_started
      quiz-service:
        condition: service_started
      attempt-service:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    sysctls:                                                                                                                                 
      - net.core.somaxconn=4096
      - net.ipv4.tcp_max_syn_backlog=4096
    ulimits:        
      nofile:
        soft: 65536
        hard: 65536
  user-service:
    build: ./services/user-service
    expose:
      - "8000"
    secrets:
      - postgres_password
      - clerk_webhook_secret
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    sysctls:
      - net.core.somaxconn=4096
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
  quiz-service:
    build: ./services/quiz-service
    expose:
      - "8000"
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    sysctls:
      - net.core.somaxconn=4096
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
  attempt-service:
    build: ./services/attempt-service
    expose:
      - "8000"
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    sysctls:
      - net.core.somaxconn=4096
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
  postgres:
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  rabbitmq:
    image: rabbitmq:4-management
    expose:
      - "5672"
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 3s
      retries: 3
secrets:
  clerk_secret_key:
    file: ./secrets/clerk_secret_key.txt
  clerk_webhook_secret:
    file: ./secrets/clerk_webhook_secret.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
volumes:
  redis_data:
  postgres_data:
  rabbitmq_data:
