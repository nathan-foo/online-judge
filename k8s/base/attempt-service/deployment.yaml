apiVersion: apps/v1
kind: Deployment
metadata:
  name: attempt-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attempt-service
  template:
    metadata:
      labels:
        app: attempt-service
    spec:
      automountServiceAccountToken: false
      containers:
        - name: attempt-service
          image: online-judge/attempt-service
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: secrets
          secret:
            secretName: app-secrets
            items:
              - key: postgres_password
                path: postgres_password
              - key: rabbitmq_password
                path: rabbitmq_password
