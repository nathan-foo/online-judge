apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-eval-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: code-eval-service
  template:
    metadata:
      labels:
        app: code-eval-service
    spec:
      serviceAccountName: code-eval-service
      containers:
        - name: code-eval-service
          image: online-judge/code-eval-service
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: EXEC_AGENT_IMAGE
              value: "online-judge/exec-agent"
            - name: EXEC_AGENT_TAG
              value: "dev"
            - name: POOL_SIZE
              value: "1"
            - name: LANGUAGES
              value: "python"
            - name: RUNTIME_CLASS_NAME
              value: ""
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: secrets
          secret:
            secretName: app-secrets
            items:
              - key: rabbitmq_password
                path: rabbitmq_password
