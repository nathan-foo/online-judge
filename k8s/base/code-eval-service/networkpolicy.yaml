apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: exec-agent-isolation
spec:
  podSelector:
    matchLabels:
      managed-by: code-eval-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: code-eval-service
      ports:
        - protocol: TCP
          port: 8000
  egress: []
