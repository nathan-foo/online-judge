apiVersion: v1
kind: ServiceAccount
metadata:
  name: code-eval-service
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: exec-pool-manager
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: code-eval-service-pool
subjects:
  - kind: ServiceAccount
    name: code-eval-service
roleRef:
  kind: Role
  name: exec-pool-manager
  apiGroup: rbac.authorization.k8s.io
